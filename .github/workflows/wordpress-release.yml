# Releases the WordPress plugin: push a tag named wordpress-vX.Y.Z (matching the Version in the plugin header) and
# this builds digibyte-digifacts.zip and publishes a GitHub release with it attached.
#   git tag wordpress-v2.0.1 && git push origin wordpress-v2.0.1
name: Release the WordPress plugin

on:
  push:
    tags: ["wordpress-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#wordpress-v}"
          header=$(sed -n 's/^ \* Version: *//p' wordpress/digibyte-digifacts/digibyte-digifacts.php | tr -d '[:space:]')
          stable=$(sed -n 's/^Stable tag: *//p' wordpress/digibyte-digifacts/readme.txt | tr -d '[:space:]')
          if [ "$tag" != "$header" ] || [ "$tag" != "$stable" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the plugin Version ($header) and readme.txt Stable tag ($stable)"
            exit 1
          fi
          php -l wordpress/digibyte-digifacts/digibyte-digifacts.php
          php -l wordpress/digibyte-digifacts/uninstall.php
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the zip
        run: cd wordpress && zip -qr ../digibyte-digifacts.zip digibyte-digifacts -x '*.DS_Store'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The release notes are this version's changelog entry from readme.txt
          notes=$(awk -v v="= $VERSION =" '$0==v{f=1;next} f&&/^= /{exit} f&&NF' wordpress/digibyte-digifacts/readme.txt)
          printf '%s\n\nTo install or update: in WordPress, go to Plugins > Add New Plugin > Upload Plugin and choose digibyte-digifacts.zip. When updating, choose **Replace current with uploaded** - your settings are kept.\n' "$notes" > notes.md
          gh release create "$GITHUB_REF_NAME" digibyte-digifacts.zip --title "DigiFacts WordPress plugin $VERSION" --notes-file notes.md --latest
